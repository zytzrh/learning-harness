[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learning-harness"
version = "0.1.0"
description = "Persistent, annotation-driven learning with interchangeable language models"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
learning-harness = "learning_harness.server:main"

[tool.setuptools.package-data]
learning_harness = ["static/*"]

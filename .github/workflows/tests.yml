name: tests
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: pip install .
      - run: learning-harness --help
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check learning_harness/static/app.js
      - run: node tests/test_work_state.cjs
      - run: node --check skills/learning-harness/assets/client.js
      - run: npm ci --ignore-scripts
      - run: npm test
